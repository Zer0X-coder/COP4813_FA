<!-- MAIN CONTENT -->

<main>

    <section class="form-section">

        <h2>Contact Zer0X</h2>

        <p>
            Complete the form below. All fields are required.
        </p>


        <!-- CONTACT FORM -->

        <form id="contact-form" novalidate>


            <!-- FIRST NAME -->

            <div class="form-group">

                <label for="firstname">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstname"
                    name="firstname"
                    autocomplete="given-name"
                    required
                >

                <span
                    class="error"
                    id="firstname-error">
                </span>

            </div>


            <!-- LAST NAME -->

            <div class="form-group">

                <label for="lastname">
                    Last Name
                </label>

                <input
                    type="text"
                    id="lastname"
                    name="lastname"
                    autocomplete="family-name"
                    required
                >

                <span
                    class="error"
                    id="lastname-error">
                </span>

            </div>


            <!-- STREET ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Street Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    autocomplete="street-address"
                    required
                >

                <span
                    class="error"
                    id="address-error">
                </span>

            </div>


            <!-- CITY, STATE, ZIP -->

            <div class="form-row">


                <!-- CITY -->

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        autocomplete="address-level2"
                        required
                    >

                    <span
                        class="error"
                        id="city-error">
                    </span>

                </div>


                <!-- STATE -->

                <div class="form-group">

                    <label for="state">
                        State
                    </label>

                    <select
                        id="state"
                        name="state"
                        autocomplete="address-level1"
                        required
                    >

                        <option value="">
                            Select State
                        </option>

                        <option value="FL">
                            Florida
                        </option>

                        <option value="GA">
                            Georgia
                        </option>

                        <option value="NY">
                            New York
                        </option>

                        <option value="NC">
                            North Carolina
                        </option>

                        <option value="SC">
                            South Carolina
                        </option>

                    </select>

                    <span
                        class="error"
                        id="state-error">
                    </span>

                </div>


                <!-- ZIP CODE -->

                <div class="form-group">

                    <label for="zip">
                        ZIP Code
                    </label>

                    <input
                        type="text"
                        id="zip"
                        name="zip"
                        maxlength="10"
                        autocomplete="postal-code"
                        required
                    >

                    <span
                        class="error"
                        id="zip-error">
                    </span>

                </div>

            </div>


            <!-- PHONE NUMBER -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="(000)000-0000"
                    maxlength="13"
                    autocomplete="tel"
                    required
                >

                <span
                    class="error"
                    id="phone-error">
                </span>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="name@example.com"
                    autocomplete="email"
                    required
                >

                <span
                    class="error"
                    id="email-error">
                </span>

            </div>


            <!-- BIRTH DATE -->

            <div class="form-group">

                <label for="birthdate">
                    Birth Date
                </label>

                <input
                    type="date"
                    id="birthdate"
                    name="birthdate"
                    autocomplete="bday"
                    required
                >

                <span
                    class="error"
                    id="birthdate-error">
                </span>

            </div>


            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                ></textarea>

                <span
                    class="error"
                    id="message-error">
                </span>

            </div>


            <!-- SECURITY QUESTION -->

            <div class="form-group">

                <label for="confirm">
                    Security Check: What is 4 + 3?
                </label>

                <input
                    type="number"
                    id="confirm"
                    name="confirm"
                    autocomplete="off"
                    required
                >

                <span
                    class="error"
                    id="confirm-error">
                </span>

            </div>


            <!-- REVIEW BUTTON -->

            <button
                type="submit"
                class="form-button"
            >
                Review Information
            </button>


        </form>

    </section>

</main>
